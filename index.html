<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Blocks - 赛博朋克俄罗斯方块 Version 2.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 动态背景 -->
    <div class="animated-background"></div>

    <!-- 主题切换器 -->
    <div class="theme-switcher">
        <button class="theme-btn" data-theme="cyberpunk" title="Cyberpunk"></button>
        <button class="theme-btn" data-theme="retro" title="Retro"></button>
        <button class="theme-btn" data-theme="neon" title="Neon"></button>
        <button class="theme-btn" data-theme="dark" title="Dark"></button>
        <button class="theme-btn" data-theme="candy" title="Candy"></button>
    </div>

    <div id="game-container">
        <h1>CYBER BLOCKS <span class="version">V2.0</span></h1>

        <div class="game-area">
            <!-- Hold区域 -->
            <div class="side-panel left-panel">
                <div class="panel-section">
                    <h3>HOLD</h3>
                    <canvas id="hold" width="120" height="120"></canvas>
                    <p class="help-text">Press C</p>
                </div>
            </div>

            <!-- 主游戏区 -->
            <div class="main-game">
                <canvas id="tetris" width="300" height="600"></canvas>
            </div>

            <!-- 信息面板 -->
            <div class="side-panel right-panel">
                <div class="panel-section">
                    <h3>NEXT</h3>
                    <canvas id="next" width="120" height="120"></canvas>
                </div>

                <div class="panel-section stats">
                    <h3>SCORE</h3>
                    <p class="stat-value" id="score">0</p>

                    <h3>LEVEL</h3>
                    <p class="stat-value" id="level">1</p>

                    <h3>LINES</h3>
                    <p class="stat-value" id="lines">0</p>

                    <div id="combo-display" class="combo-section">
                        <h3>COMBO</h3>
                        <p class="stat-value combo-value" id="combo"></p>
                    </div>
                </div>

                <div class="panel-section controls">
                    <h3>CONTROLS</h3>
                    <p>← → : Move</p>
                    <p>↑ : Rotate</p>
                    <p>↓ : Soft Drop</p>
                    <p>SPACE : Hard Drop</p>
                    <p>C : Hold</p>
                    <p>P : Pause</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 移动端控制 -->
    <div class="mobile-controls">
        <div class="control-row">
            <button id="moveLeft" class="control-btn">◄</button>
            <button id="rotate" class="control-btn">↻</button>
            <button id="moveRight" class="control-btn">►</button>
        </div>
        <div class="control-row">
            <button id="hold" class="control-btn small">HOLD</button>
            <button id="moveDown" class="control-btn">▼</button>
            <button id="hardDrop" class="control-btn small">DROP</button>
        </div>
        <div class="control-row">
            <button id="pauseBtn" class="control-btn wide">PAUSE</button>
        </div>
    </div>

    <!-- 游戏结束遮罩 -->
    <div id="gameOverOverlay" class="hidden">
        <div class="gameOverContent">
            <h2>GAME OVER</h2>
            <p>Your Score: <span id="finalScore">0</span></p>
            <button id="restartButton">PLAY AGAIN</button>
        </div>
    </div>

    <!-- 使用ES6模块 -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
